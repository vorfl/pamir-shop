<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>PAMIR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <!-- Знак гор PAMIR и иконки, на которые ссылаются карточки -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="mark" viewBox="0 0 48 32">
      <path d="M2 30 17 5l9 15 6-9 14 19Z"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
  </svg>

  <div id="banner" class="banner" hidden></div>

  <header class="top">
    <div class="brand">
      <svg class="brand__mark" aria-hidden="true"><use href="#mark"/></svg>
      <h1 class="brand__name">PAMIR</h1>
    </div>
    <div class="lang" role="group" aria-label="Мова / Язык">
      <button type="button" data-lang="ua" aria-pressed="true">UA</button>
      <button type="button" data-lang="ru" aria-pressed="false">RU</button>
    </div>
  </header>

  <div class="tools">
    <label class="search">
      <span class="search__icon" id="searchIcon" aria-hidden="true"></span>
      <input id="search" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" spellcheck="false">
    </label>
    <div class="chips" id="chips" role="group"></div>
  </div>

  <main id="main" class="main" aria-live="polite"></main>

  <div id="backdrop" class="backdrop" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></section>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
