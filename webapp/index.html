<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FAF6EF">
  <meta name="format-detection" content="telephone=no">
  <title>PAMIR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=15">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body data-view="catalog">
  <!-- Логотип PAMIR (webapp/logo.svg), знак гор из него же и иконки, на которые ссылаются карточки -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="mark" viewBox="735 319 380 249">
      <path fill-rule="evenodd" d="M739.86 563.36 L813.33 563.36 L868.17 479.72 L923.01 563.36 L955.35 563.36 L967.92 543.59 L893.74 419.96 L909.74 426.70 L974.32 534.34 L1002.77 491.03 L1044.01 563.36 L1110.05 563.36 L1003.11 380.89 L949.63 468.87 L867.37 323.64 Z M867.60 348.10 L906.79 415.51 L877.88 400.77 L863.14 429.79 L849.09 402.25 L819.38 421.22 Z M1002.65 399.51 L1035.92 449.28 L1011.11 437.33 L999.79 457.90 L989.03 438.27 L965.86 451.61 Z M1025.55 451.38 L1036.47 456.41 L1091.09 543.25 L1085.33 546.45 L1028.70 456.41 Z"/>
    </symbol>
    <symbol id="logo" viewBox="290 318 1194 251"><path fill-rule="evenodd" d="M295.00 363.60 L397.12 363.60 A68.46 68.46 0 0 1 397.12 500.51 L339.33 500.51 L339.33 563.36 L295.00 563.36 Z M339.33 399.17 L388.54 399.17 A32.71 32.71 0 0 1 388.54 464.60 L339.33 464.60 Z"/><path fill-rule="evenodd" d="M579.79 363.60 L587.42 363.60 L695.29 563.36 L649.06 563.36 L628.88 525.99 L538.34 525.99 L518.16 563.36 L471.92 563.36 Z M583.61 449.22 L610.21 491.42 L557.00 491.42 Z"/><path fill-rule="evenodd" d="M739.86 563.36 L813.33 563.36 L868.17 479.72 L923.01 563.36 L955.35 563.36 L967.92 543.59 L893.74 419.96 L909.74 426.70 L974.32 534.34 L1002.77 491.03 L1044.01 563.36 L1110.05 563.36 L1003.11 380.89 L949.63 468.87 L867.37 323.64 Z M867.60 348.10 L906.79 415.51 L877.88 400.77 L863.14 429.79 L849.09 402.25 L819.38 421.22 Z M1002.65 399.51 L1035.92 449.28 L1011.11 437.33 L999.79 457.90 L989.03 438.27 L965.86 451.61 Z M1025.55 451.38 L1036.47 456.41 L1091.09 543.25 L1085.33 546.45 L1028.70 456.41 Z"/><path fill-rule="evenodd" d="M1158.88 363.60 L1203.21 363.60 L1203.21 563.36 L1158.88 563.36 Z"/><path fill-rule="evenodd" d="M1302.25 363.60 L1408.02 363.60 A64.81 64.81 0 0 1 1427.27 490.29 L1479.00 563.36 L1429.06 563.36 L1379.40 493.22 L1346.57 493.22 L1346.57 563.36 L1302.25 563.36 Z M1346.57 399.17 L1399.26 399.17 A29.23 29.23 0 0 1 1399.26 457.64 L1346.57 457.64 Z"/></symbol>
    <defs>
      <path id="d-step" d="M12 3h4v3h3v3h3v4h-3v3h-3v3h-4v-3h-3v-3H6v-4h3V6h3z"/>
      <!-- Орнамент «ступенчатый ромб» (своя отрисовка) -->
      <pattern id="o1" width="28" height="44" patternUnits="userSpaceOnUse">
        <g style="stroke:var(--orn);fill:none" stroke-width="1.2" stroke-linejoin="miter">
          <use href="#d-step"/><use href="#d-step" x="14" y="22"/><use href="#d-step" x="-14" y="22"/>
        </g>
        <g style="fill:var(--orn)"><path d="M13 10h2v2h-2z"/><path d="M-1 32h2v2h-2z"/><path d="M27 32h2v2h-2z"/></g>
      </pattern>
    </defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
  </svg>

  <div id="banner" class="banner" hidden></div>
  <div id="notice" class="notice" role="status" hidden></div>

  <header class="top">
    <svg class="orn" aria-hidden="true"><rect width="100%" height="100%" fill="url(#o1)"/></svg>
    <h1 class="brand"><svg class="brand__logo" role="img" aria-label="PAMIR"><use href="#logo"/></svg><span id="season" class="season" hidden></span></h1>
    <div class="top__right">
      <button type="button" id="adminBtn" class="iconbtn" aria-label="Адмін-панель" hidden>
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>
      </button>
      <div class="lang" role="group" aria-label="Мова / Язык">
        <button type="button" data-lang="ua" aria-pressed="true">UA</button>
        <button type="button" data-lang="ru" aria-pressed="false">RU</button>
      </div>
    </div>
  </header>

  <div class="tools">
    <div class="tools__row">
      <label class="search">
        <span class="search__icon" id="searchIcon" aria-hidden="true"></span>
        <input id="search" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="button" id="searchClear" class="search__clear" aria-label="Очистити" hidden></button>
      </label>
      <button type="button" id="filterBtn" class="toolbtn" aria-label="Сортування і фільтри">
        <span id="filterIcon" aria-hidden="true"></span>
        <span id="filterDot" class="toolbtn__dot" hidden></span>
      </button>
    </div>
    <div class="recent" id="recent" hidden></div>
    <div class="chips" id="chips" role="group"></div>
  </div>

  <main id="main" class="main"></main>

  <!-- Экраны: корзина, оформление, «замовлення прийнято» -->
  <section id="page" class="page"></section>

  <!-- Нижняя навигация: каталог, избранное, корзина, профиль -->
  <nav id="tabbar" class="tabbar" aria-label="PAMIR"></nav>

  <div id="bar" class="bar" hidden><button type="button" id="barBtn" class="btn btn--primary btn--block"></button></div>
  <div id="toast" class="toast" role="status" hidden><span id="toastText"></span><button type="button" id="toastBtn" class="toast__btn" hidden></button></div>

  <div id="backdrop" class="backdrop" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></section>

  <script src="config.js?v=15"></script>
  <script src="app.js?v=15"></script>
</body>
</html>
